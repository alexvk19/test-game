<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Type" content="text/html; charset=cp1251" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
        <link href="styles.css" rel="stylesheet">
        <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>     
        <script src="script.js"></script>
        <title>Сапёр | Игра-пример для ВКонтакте</title>
    </head>
    <body>
        <!-- Область заголовка -->
        <div class="headerArea">
        <h1>Сапёр (index1.html) | <span class="title2">Игра-пример для ВКонтакте</span></h1>
        <p id="test-info" style="color: #FFF0F0;">placeholder</p>    
        </div>
        

        <div>
            <!-- Игровое поле -->
            <div class="board-container">
                <canvas id="board"></canvas>
            </div>

            <!-- Различная информация и элементы управления -->
            <div class="controls" id="my-form">
                <p>Время: <span id="time-elapsed"></span></p>
                <p>Отмечено мин: <span id="marked-cells"></span></p>
                <p><input id="button" type="button" value="Сбросить"/></p>
                <div id="description"></div>
                <div id="notification"></div>                
                <!-- p><input id="new-game-button" type="button" value="Новая игра"/></p -->
                
                <!-- Ниже идут тестовые кнопки и др контролы -->
                <input type="text" id="edit1" value="" />
                <input id="btn1" type="button" value="Тест">
                <p>Музыка: Johann Strauss II &mdash; Waltz</p>
                <audio id="my_audio" src="johann-strauss-ii-waltz.mp3" controls></audio>
            </div>
        </div>
    </body>
</html>
